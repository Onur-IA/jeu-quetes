<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1D2A44">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quêtes">
<meta name="format-detection" content="telephone=no">
<title>Quêtes du jour</title>
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" href="icones/demarrage-1320x2868.png">
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="icones/demarrage-1290x2796.png">
<link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)" href="icones/demarrage-1206x2622.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="icones/demarrage-1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="icones/demarrage-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="icones/demarrage-1125x2436.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="icones/demarrage-828x1792.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="icones/demarrage-750x1334.png">
<link rel="stylesheet" href="express.css">
</head>
<body>
<main id="x" aria-busy="true">
  <header id="x-haut">
    <div id="x-hud" aria-live="polite"></div>
    <div class="x-outils">
      <button type="button" class="x-rond" id="x-son" data-x="son" aria-pressed="false" aria-label="Musique et sons">Son</button>
      <button type="button" class="x-rond" id="x-synchro" data-x="synchro" aria-label="Sauvegarde"><i id="x-pastille"></i>Sauvegarde</button>
      <a class="x-rond" id="x-immeuble" href="./" aria-label="Ouvrir l'immeuble">Immeuble</a>
    </div>
  </header>
  <section id="x-anneau" aria-live="polite"></section>
  <div id="x-bandeau" role="status" hidden></div>
  <section id="x-liste" aria-label="Quêtes du jour"></section>
  <form id="x-ajout" autocomplete="off">
    <input type="text" name="texte" maxlength="160" enterkeyhint="done" placeholder="Une quête de plus..." aria-label="Écrire une quête">
    <label class="x-cout-ajout">Coût
      <select id="x-cout" name="cout" aria-label="Coût d'énergie">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </label>
    <button type="submit">Ajouter</button>
  </form>
</main>
<div id="x-degres" class="x-feuille" role="dialog" aria-modal="true" aria-labelledby="x-degres-titre" hidden></div>
<div id="x-panneau" class="x-feuille" role="dialog" aria-modal="true" aria-labelledby="x-panneau-titre" hidden></div>
<div id="x-toast" role="status" aria-live="polite" hidden></div>
<canvas id="x-confettis" aria-hidden="true"></canvas>
<script src="haptique.js"></script>
<script src="son.js"></script>
<script src="musique.js"></script>
<script src="qr.js"></script>
<script src="moteur.js"></script>
<script src="api-local.js"></script>
<script src="express.js"></script>
</body>
</html>
